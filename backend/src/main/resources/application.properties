# ??????????????????????????????????????????????????????????????
# Spring Mail ? Brevo SMTP relay
# Identifiants injectés via variables d'environnement, jamais en dur ici.
# Voir MAIL_SETUP.md pour la procédure de création des identifiants Brevo.
# ??????????????????????????????????????????????????????????????

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM:no-reply@miniesb.app}
spring.mail.from-name=${MAIL_FROM_NAME:miniESB}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# ?? Logging ????????????????????????????????????????????????????
logging.level.root=INFO
logging.level.com.miniESB.audit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ?? Scheduling (purge automatique des logs) ????????????????????
spring.task.scheduling.enabled=true
